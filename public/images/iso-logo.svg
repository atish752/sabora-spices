<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" width="100%" height="100%" fill="none">
  <!-- Outer subtle rounded container for crisp display on light or dark backgrounds -->
  <rect x="2" y="2" width="316" height="136" rx="14" fill="#003366" />
  <rect x="2" y="2" width="316" height="136" rx="14" stroke="#004F9F" stroke-width="2" />
  
  <!-- Left: Globe/Compass ISO Quality Seal -->
  <g transform="translate(18, 16)">
    <!-- Outer Seal Ring -->
    <circle cx="54" cy="54" r="50" fill="#002244" stroke="#F59E0B" stroke-width="2.5" />
    <circle cx="54" cy="54" r="45" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="2 3" />
    
    <!-- ISO Globe Latitude / Longitude lines -->
    <circle cx="54" cy="54" r="36" fill="#004080" stroke="#FFFFFF" stroke-width="1.5" />
    <ellipse cx="54" cy="54" rx="20" ry="36" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.8" />
    <line x1="18" y1="54" x2="90" y2="54" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.9" />
    <line x1="22" y1="36" x2="86" y2="36" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.7" />
    <line x1="22" y1="72" x2="86" y2="72" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.7" />
    <line x1="54" y1="18" x2="54" y2="90" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.9" />
    
    <!-- Central Shield / Star accent -->
    <polygon points="54,42 57,51 66,51 59,57 61,66 54,61 47,66 49,57 42,51 51,51" fill="#F59E0B" />
  </g>

  <!-- Right: Official Typography -->
  <g transform="translate(142, 22)">
    <!-- Top small label -->
    <text x="0" y="20" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" letter-spacing="2.5">INTERNATIONAL</text>
    <text x="0" y="32" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" letter-spacing="1.5">ORGANIZATION FOR STANDARDIZATION</text>
    
    <!-- Main ISO 9001:2015 brand heading -->
    <text x="0" y="66" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="900" letter-spacing="1">ISO 9001</text>
    <text x="132" y="66" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">:2015</text>
    
    <!-- Bottom Certification Ribbon / Subtitle -->
    <rect x="0" y="76" width="162" height="18" rx="4" fill="#004F9F" />
    <text x="81" y="89" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5" text-anchor="middle">CERTIFIED COMPANY</text>
  </g>
</svg>
